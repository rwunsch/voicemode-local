<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice pill</title>
<link rel="stylesheet" href="pill.css">
</head>
<body data-mode="pill" data-phase="disconnected" data-tone="off">
<button id="tab" class="tab" title="Bring back" aria-label="Bring back">&#x2039;</button>
<div id="edgeL" class="edge left"></div>
<div id="edgeR" class="edge right"></div>
<main id="card" class="card">
  <div class="row top">
    <div id="drag" class="drag"><div id="orb" class="orb" role="img" aria-label="Disconnected"></div><b id="sub" class="name"></b><span id="waiting" class="waiting"></span></div>
    <div id="label" class="state">Disconnected</div>
    <button id="main" class="btn pic main" title="Pause" aria-label="Pause"><span id="mainStop">&#x25A0;&#xFE0E;</span><span id="mainWake" class="wakeicon" hidden><svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 19h18"/><path d="M7 19a5 5 0 0 1 10 0"/><path d="M12 7.5v2.5"/><path d="M5.6 11.6l1.8 1.8"/><path d="M18.4 11.6l-1.8 1.8"/></svg></span></button>
    <button id="pause" class="btn pic" data-kind="voiceoff" title="Voice off: continue in text" aria-label="Voice off: continue in text" hidden>&#x25A0;&#xFE0E;</button>
    <button id="expand" class="btn icon" title="Expand" aria-label="Expand" aria-expanded="false">&#x2304;</button>
    <button id="dockTop" class="btn icon" title="Dock to the side" aria-label="Dock to the side">&#x203A;</button>
    <button id="minimize" class="btn icon" title="Minimize; right-click the icon to quit" aria-label="Minimize; right-click the icon to quit">_</button>
    <button id="tuck" class="btn icon tuck" title="Slide out of view" aria-label="Slide out of view">&#x203A;</button>
  </div>
  <section id="more" class="more">
    <div id="controls" class="row controls" role="group" aria-label="Voice controls">
      <button id="ctlPause" class="btn ctl" data-kind="pause" aria-label="Pause: hold voice; the mic closes and the reply waits" aria-pressed="false"><span id="ctlPauseIcon" class="ic" aria-hidden="true">&#x23F8;&#xFE0E;</span><span id="ctlPauseText">Pause</span></button>
      <button id="ctlMic" class="btn ctl" data-kind="pausemic" hidden><span id="ctlMicIcon" class="ic" aria-hidden="true">&#x23F8;&#xFE0E;</span><span id="ctlMicText">Pause mic</span></button>
      <button id="ctlMain" class="btn ctl" data-kind="voiceoff" aria-label="Voice off: continue in text"><span id="ctlMainIcon" class="ic" aria-hidden="true">&#x25A0;&#xFE0E;</span><span id="ctlMainText">Voice off</span></button>
    </div>
    <div class="row">
      <select id="voice" aria-label="Voice"></select>
      <button id="preview" class="btn preview" title="Hear a short sample of this voice" aria-label="Preview this voice">&#x25B6;&#xFE0E; Preview</button>
      <select id="language" aria-label="Language"></select>
    </div>
    <div id="previewStatus" class="m" role="status" aria-live="polite"></div>
    <div id="bargeRow" class="row between"><label for="barge">Interrupt by voice</label>
      <button id="barge" class="btn" role="switch" aria-checked="false">Off</button></div>
    <div class="row between"><label for="beeps">Beeps</label>
      <button id="beeps" class="btn" role="switch" aria-checked="false">Off</button></div>
    <div id="count" class="m"></div>
    <div id="queue"></div>
    <div id="keys" class="m"></div>
    <div class="row between foot">
      <button id="dock" class="btn">Dock</button>
    </div>
  </section>
</main>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
