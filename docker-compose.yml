services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: voicemode-whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=faster_whisper
    restart: unless-stopped

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.1.5
    container_name: voicemode-kokoro
    ports:
      - "8880:8880"
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: voicemode-piper
    ports:
      - "10200:10200"
    volumes:
      - ./models/piper:/data/models/piper
    command: --voice de_DE-thorsten-high
    restart: unless-stopped
    profiles:
      - piper
